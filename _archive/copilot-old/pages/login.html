<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in | ReanRush</title>
<link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/header.css"><link rel="stylesheet" href="../css/nav.css"><link rel="stylesheet" href="../css/footer.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/pages/login.css"><script src="../js/jquery-3.7.1.min.js"></script></head>
<body data-root=".."><div data-include="header"></div><div data-include="nav"></div><div data-include="khmer-strip"></div>
<main class="site-main"><header class="page-heading"><span class="eyebrow">Welcome back</span><h1 id="login-title">Log in as a Student</h1><p>Pick up where your class left off.</p></header><section class="panel auth-panel"><form id="login-form" class="stack"><div class="role-picker row" role="group" aria-label="Choose account role"><button class="btn btn-gold btn-small role-card" data-role="student" aria-pressed="true" type="button">Student</button><button class="btn btn-secondary btn-small role-card" data-role="host" aria-pressed="false" type="button">Host</button><button class="btn btn-secondary btn-small role-card" data-role="admin" aria-pressed="false" type="button">Admin</button></div><label class="field">Email<input id="login-email" name="email" type="email" autocomplete="username" required placeholder="student@school.edu.kh"></label><label class="field">Password<input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><div class="row"><label><input type="checkbox" name="remember"> Remember me</label><a id="signup-link" href="signup.html">Need an account?</a></div><button class="btn" type="submit">Log in</button><button class="btn btn-secondary" id="google-login" type="button">Continue with Google</button></form></section></main>
<div data-include="footer"></div><div data-include="toast"></div><script src="../js/data.js"></script><script src="../js/toast.js"></script><script src="../js/main.js"></script><script src="../js/include.js"></script><script src="../js/login.js"></script></body></html>
