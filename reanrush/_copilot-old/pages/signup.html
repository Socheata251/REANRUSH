<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up | ReanRush</title>
<link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/header.css"><link rel="stylesheet" href="../css/nav.css"><link rel="stylesheet" href="../css/footer.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/pages/signup.css"><script src="../js/jquery-3.7.1.min.js"></script></head>
<body data-root=".."><div data-include="header"></div><div data-include="nav"></div><div data-include="khmer-strip"></div>
<main class="site-main"><header class="page-heading"><span class="eyebrow">Start your streak</span><h1>Create your account</h1><p>Make a student profile and meet your next team.</p></header><section class="panel auth-panel"><form id="signup-form" class="stack" data-role="student" data-next="nickname.html"><div class="role-picker row" role="group" aria-label="Choose account role"><button class="btn btn-gold btn-small role-card" data-role="student" aria-pressed="true" type="button">Student</button><button class="btn btn-secondary btn-small role-card" data-role="host" aria-pressed="false" type="button">Host</button></div><label class="field">Your name<input name="name" autocomplete="name" required placeholder="Name shown in games"></label><label class="field" id="school-name-field" hidden>School name<input name="school" autocomplete="organization" placeholder="Your school"></label><label class="field">School email<input name="email" type="email" autocomplete="email" required placeholder="you@school.edu.kh"></label><label class="field">Password<input id="signup-password" name="password" type="password" minlength="8" required placeholder="At least 8 characters"></label><label><input id="show-password" type="checkbox"> Show password</label><button class="btn" type="submit">Create account</button><p class="muted">Already have an account? <a href="login.html">Log in</a></p></form></section></main>
<div data-include="footer"></div><div data-include="toast"></div><script src="../js/data.js"></script><script src="../js/toast.js"></script><script src="../js/main.js"></script><script src="../js/include.js"></script><script src="../js/signup.js"></script></body></html>
