<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ReanRush | Battle Lobby</title>
	<link rel="stylesheet" href="../../css/base.css">
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="../../js/tailwind-config.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Kantumruy+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-surface-container font-body-md text-on-surface">
<main class="mx-auto flex min-h-screen w-full max-w-lg flex-col justify-center gap-4 px-4 py-8 pb-24">
	<section class="rounded-2xl border-[3px] border-primary-container bg-surface-container-lowest p-4 shadow-[6px_6px_0px_#0b2a5b]">
		<div class="mb-4 flex items-center justify-between rounded-xl bg-primary-container px-3 py-2 text-white">
			<span class="font-badge-arcade text-badge-arcade tracking-wider">PIN <span data-action="lobby-pin">------</span></span>
			<span class="font-label-bold text-label-bold"><span data-action="lobby-player-count">1</span> players</span>
		</div>
		<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Battle Lobby</h1>
		<p class="mt-1 text-on-surface-variant" data-action="lobby-waiting-message" id="lobby-waiting-message">Waiting for the host to start the battle...</p>
		<p class="mt-3 rounded-xl bg-tertiary-fixed px-3 py-2 font-label-bold text-primary">Host starts in <span data-action="lobby-countdown" id="lobby-start-countdown">10s</span></p>
		<h2 class="mt-5 font-headline-md text-headline-md text-primary">Players in the room</h2>
		<ul class="mt-2 flex flex-col gap-2" data-action="lobby-players" id="lobby-player-list"></ul>
	</section>
</main>
<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.05)]" data-active-classes="text-secondary"><div class="flex items-center justify-around h-16 px-gutter-mobile"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[48px] min-h-[44px] transition-colors text-secondary" data-path="arena-lobby" href="lobby.html"><span class="material-symbols-outlined text-[24px]">sports_esports</span><span class="font-badge-arcade text-badge-arcade mt-0.5">Lobby</span></a><a class="flex flex-col items-center justify-center min-w-[48px] min-h-[44px] text-on-surface-variant transition-colors" data-path="team-roster" href="team.html"><span class="material-symbols-outlined text-[24px]">group</span><span class="font-badge-arcade text-badge-arcade mt-0.5">Teams</span></a><a class="flex flex-col items-center justify-center min-w-[48px] min-h-[44px] text-on-surface-variant transition-colors" data-path="leaderboard" href="leaderboard.html"><span class="material-symbols-outlined text-[24px]">military_tech</span><span class="font-badge-arcade text-badge-arcade mt-0.5">Ranks</span></a><a class="flex flex-col items-center justify-center min-w-[48px] min-h-[44px] text-on-surface-variant transition-colors" data-path="student-profile" href="home.html"><span class="material-symbols-outlined text-[24px]">account_circle</span><span class="font-badge-arcade text-badge-arcade mt-0.5">Hero</span></a></div></nav>
<script src="../../js/jquery-3.7.1.min.js"></script>
<script defer src="../../js/game-state.js"></script>
<script defer src="../../js/lobby.js"></script>
</body>
</html>
