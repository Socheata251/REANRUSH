<script>
  (function() {
    let pin = "849";
    const slots = document.querySelectorAll('.pin-slot');
    const btnEnter = document.getElementById('btn-enter');

    function updateSlots() {
      slots.forEach((slot, idx) => {
        if (idx < pin.length) {
          slot.textContent = pin[idx];
          slot.classList.add('bg-surface-container-lowest', 'text-secondary');
          slot.classList.remove('bg-surface-container-low', 'text-primary');
        } else {
          slot.textContent = '';
          slot.classList.remove('bg-surface-container-lowest', 'text-secondary');
          slot.classList.add('bg-surface-container-low', 'text-primary');
        }

        // Active cursor highlight
        if (idx === pin.length) {
          slot.classList.add('border-secondary');
        } else {
          slot.classList.remove('border-secondary');
        }
      });
    }

    document.querySelectorAll('.num-key').forEach(btn => {
      btn.addEventListener('click', () => {
        if (pin.length < 6) {
          pin += btn.textContent.trim();
          updateSlots();
          if (pin.length === 6) {
            btnEnter.classList.add('ring-4', 'ring-secondary-fixed');
          }
        }
      });
    });

    document.getElementById('btn-backspace').addEventListener('click', () => {
      if (pin.length > 0) {
        pin = pin.slice(0, -1);
        updateSlots();
        btnEnter.classList.remove('ring-4', 'ring-secondary-fixed');
      }
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      pin = '';
      updateSlots();
      btnEnter.classList.remove('ring-4', 'ring-secondary-fixed');
    });

    // Initial render
    updateSlots();
  })();
</script></main></body></html>
